<!--
  ▼▼▼ 行程資料：想換行程，只要改這一個物件 ▼▼▼

  days[].stops[] 可用欄位
    t     時間（字串，例如 "16:00"、"下午"）
    name  地點名稱
    q     Google 地圖搜尋字（省略時用 name）
    cat   類別：food 食／shop 買／sight 景／ride 遊／hotel 宿／move 移
    stay  停留時長
    move  從上一站過來的交通（用 \n 換行）
    note  備註（用 \n 換行）
    tags  標籤陣列；開頭加 ! 會變成朱紅印記，例如 "!需預約"
    stamp 完成蓋印的印章字（最多4字，省略時自動取地名）
    short 路線圖上顯示的短名稱
    ll    座標 [緯度, 經度]；有座標才會畫在路線圖上，沒填就不畫
    pk    園區座標 [x, y]：在園區底圖上的位置，左→右、上→下各 0～100（百分比）；有 days[].park 時才會畫在園區圖上
  party[]  同行夥伴 { name, img }；img 對應檔案下方 av-名稱 的頭像
  days[].park 園區圖設定 { title, note, img, w, h, v, paths }
              paths 是園內步道 [[x1, y1, x2, y2, …], …]（百分比，同 pk）；線與線要接在一起的點，座標要寫得一模一樣。
              img 是底圖（PARK_IMG 裡的名稱或圖片網址），w／h 是圖片原始寬高；
              沒有 img 時可改用 zones:[{name,c,x,y,w,h}] 畫色塊示意圖。
              改了底圖或座標，請把 v 加 1，已存在瀏覽器裡的舊座標才會被換掉。
  days[].mapNote 路線圖下方的補充說明（選填）

  使用者在網頁上的編輯與蓋印，存在各自瀏覽器的 localStorage（以 id 區分）。
  之後要「加一站」又不想清掉大家的蓋印：把 rev 加 1，新站加上 add: 新的 rev，
  已經存過資料的瀏覽器會自動把這站插進去（接在原始行程的前一站後面）。
  換成全新行程時，請同時改 id，舊的編輯才不會蓋過新資料。
-->

*,*::before,*::after{box-sizing:border-box}
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  font-size:clamp(15px,4.3vw,17px);
  background-color:var(--bg); background-image:var(--tex);
  scroll-padding-top:env(safe-area-inset-top,0px);
}
body{
  margin:0; color:var(--ink); font-family:var(--serif);
  line-height:1.75; letter-spacing:.02em; overflow-wrap:anywhere;
  min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);
  z-index:40; background:var(--bg);
}
button{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--asagi);outline-offset:2px}
[hidden]{display:none!important}

.app{max-width:480px;margin:0 auto;position:relative;padding-bottom:calc(6.5rem + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){
  .app{background-color:var(--bg);background-image:var(--tex);box-shadow:0 0 0 2px var(--edge),0 0 2.5rem rgba(0,0,0,.2)}
}

/* ── 頂部：青海波＋雲霞＋題簽＋印章 ── */
.hero{
  position:relative; overflow:hidden; background:var(--sea-a);
  border-bottom:2px solid var(--edge);
  padding:1.4rem 1rem 4.4rem; min-height:14rem;
}
.sea{position:absolute;inset:0;width:100%;height:100%;display:block}
.sea circle{stroke:var(--sea-line);stroke-width:1.1;stroke-opacity:.55}
.sea .a{fill:var(--sea-a)}
.sea .b{fill:var(--sea-b)}
.drift-sea{animation:seaMove 26s linear infinite}
@keyframes seaMove{to{transform:translateX(-40px)}}

.kasumi{position:absolute;left:0;bottom:0;width:100%;height:56px;display:block;pointer-events:none}
.k{fill:var(--cloud)}
.k1{opacity:.5}.k2{opacity:.75}.k3{opacity:.95}
.kl1{animation:cloud 90s linear infinite}
.kl2{animation:cloud 62s linear infinite}
.kl3{animation:cloud 46s linear infinite}
@keyframes cloud{to{transform:translateX(-240px)}}

.cart{
  position:relative; z-index:2; display:inline-block; max-width:calc(100% - 4.4rem);
  background-color:var(--card); background-image:var(--tex);
  border:2px solid var(--edge); outline:1px solid var(--edge); outline-offset:3px;
  padding:.8rem 1rem .85rem; margin:.2rem 0 0 .2rem;
}
.cart h1{margin:0;font-size:clamp(1.55rem,7vw,2.05rem);font-weight:800;line-height:1.3;letter-spacing:.08em}
.cart .range{margin:.4rem 0 0;padding-top:.4rem;border-top:1px solid var(--line);font-size:.95rem;font-weight:500}
.cart .sub{margin:.1rem 0 0;font-size:.85rem;color:var(--line)}
.cart .sub b{color:var(--ink);font-weight:700;margin-right:.7em}

.sealbox{--rot:-6deg;transform:rotate(var(--rot))}
.sealbox.pop{animation:stamp .75s cubic-bezier(.2,.9,.3,1.2) both}
.sealbox svg{width:100%;height:100%;display:block;overflow:visible}
.hero .sealbox{position:absolute;top:1rem;right:.9rem;width:4.3rem;height:4.3rem;z-index:3;animation-delay:.55s}
.seal .sb{fill:var(--red)}
.seal .si{fill:none;stroke:#FAF4E6;stroke-width:1.5}
.seal text{fill:#FAF4E6;font-family:var(--serif);font-weight:800;text-anchor:middle}
@keyframes stamp{
  0%{opacity:0;transform:rotate(calc(var(--rot) - 9deg)) scale(2.6)}
  55%{opacity:1;transform:rotate(var(--rot)) scale(.9)}
  78%{transform:rotate(var(--rot)) scale(1.04)}
  100%{opacity:1;transform:rotate(var(--rot)) scale(1)}
}

/* ── 日期分頁 ── */
.tabbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background-color:var(--card); background-image:var(--tex);
  border-bottom:2px solid var(--edge);
}
.tabs{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; scroll-snap-align:center; position:relative;
  min-width:5.2rem; min-height:max(48px,3.2rem); padding:.35rem .9rem .55rem;
  background:none; border:0; opacity:.7;
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.3;
}
.tab .l1{font-weight:800;font-size:1rem;letter-spacing:.06em}
.tab .l2{font-size:.72rem;white-space:nowrap}
.tab::after{
  content:""; position:absolute; left:.6rem; right:.6rem; bottom:0; height:.26rem;
  background:var(--red); transform:scaleX(0); transition:transform .25s ease;
}
.tab[aria-selected="true"]{opacity:1}
.tab[aria-selected="true"]::after{transform:scaleX(1)}

/* ── 日標題 ── */
#dayPanel{scroll-margin-top:4rem}
.daybar{display:flex;align-items:center;gap:.85rem;padding:1.15rem 1rem .5rem}
.daybar .sealbox{--rot:-4deg;position:relative;flex:0 0 3.1rem;width:3.1rem;height:3.1rem}
.daybar .dt{min-width:0}
.daybar .date{margin:0;font-size:.85rem;color:var(--line);font-weight:500}
.daybar h2{margin:0;font-size:1.2rem;font-weight:800;line-height:1.45}

/* ── 時間軸 ── */
.tl{--tw:3.9rem;--gap:1.15rem;--cx:calc(var(--tw) + var(--gap) / 2);padding:.7rem 1rem 0}
.stop{display:grid;grid-template-columns:var(--tw) minmax(0,1fr);column-gap:var(--gap);position:relative;padding-bottom:1.05rem}
.stop::before{content:"";position:absolute;left:calc(var(--cx) - 1px);top:0;bottom:0;width:2px;background:var(--edge)}
.stop.first::before{top:.95rem}
.stop.last::before{bottom:auto;height:.95rem}
.stop.first.last::before{display:none}
.stop.last{padding-bottom:0}
.stop::after{
  content:""; position:absolute; left:calc(var(--cx) - .45rem); top:.5rem;
  width:.9rem; height:.9rem; border-radius:50%; border:2px solid var(--edge); background:var(--cc);
}
.time{padding-top:.28rem;text-align:right;font-weight:700;font-size:.9rem;line-height:1.5;font-variant-numeric:tabular-nums;min-width:0}

.card{
  position:relative; min-width:0;
  background-color:var(--card); background-image:var(--tex);
  border:2px solid var(--edge); box-shadow:.22rem .22rem 0 var(--shadow-c);
  padding:.8rem .9rem .9rem 1.3rem;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.4rem;background:var(--cc);border-right:2px solid var(--edge)}
.head{display:flex;gap:.6rem;align-items:flex-start}
.chip{
  flex:0 0 1.55rem; width:1.55rem; height:1.55rem; margin-top:.1rem;
  border:1.5px solid var(--edge); background:var(--cc); color:var(--on);
  display:grid; place-items:center; font-size:.85rem; font-weight:800; line-height:1;
}
.head h3{margin:0;min-width:0;font-size:1.05rem;font-weight:800;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin:.45rem 0 0}
.tag{font-size:.72rem;font-weight:700;line-height:1.6;padding:0 .5rem;border:1.5px solid var(--primary);color:var(--primary)}
.tag.hot{background:var(--red);border-color:var(--red);color:#FAF4E6;transform:rotate(-2deg)}
.meta{margin:.55rem 0 0;display:grid;gap:.35rem}
.row{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.5rem;font-size:.9rem;line-height:1.65}
.row dt{margin:0;padding-top:.1rem;font-size:.78rem;font-weight:700;color:var(--line)}
.row dd{margin:0;min-width:0}
.row.wide{grid-template-columns:5.2rem minmax(0,1fr)}

.map,.pg{
  display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
  min-height:var(--tap); padding:0 1rem; border:2px solid var(--edge);
  background:transparent; color:var(--primary); font-weight:700; font-size:.9rem; text-decoration:none;
}
.map{margin-top:.75rem}
.map:active,.pg:active{background:var(--primary);color:var(--on-primary)}
.map svg,.pg svg{width:1.05rem;height:1.05rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.cat-food{--cc:var(--mustard);--on:#1F1B18}
.cat-shop{--cc:var(--sakura);--on:#1F1B18}
.cat-sight{--cc:var(--green);--on:#1F1B18}
.cat-move{--cc:var(--asagi);--on:#1F1B18}
.cat-ride{--cc:var(--primary);--on:var(--on-primary)}
.cat-hotel{--cc:var(--line);--on:var(--on-line)}

/* ── 備忘條、翻頁 ── */
.slip{
  margin:1.3rem 1rem 0; padding:.8rem .95rem .9rem;
  background-color:var(--card); background-image:var(--tex);
  border:2px solid var(--edge); border-top:.4rem solid var(--red);
}
.slip p{margin:0;font-size:.92rem}
.slip p b{font-weight:800;margin-right:.6em}
.slip ul{margin:.45rem 0 0;padding:0;list-style:none;display:grid;gap:.3rem;font-size:.88rem}
.slip li{position:relative;padding-left:1.1rem}
.slip li::before{content:"";position:absolute;left:.1rem;top:.7em;width:.4rem;height:.4rem;background:var(--red)}
.pager{display:flex;gap:.8rem;padding:1.1rem 1rem 0}
.pager .pg{flex:1;background-color:var(--card)}
.pager .sp{flex:1}

/* ── 清單 ── */
.listwrap{padding:1.2rem 1rem 0}
.lh h2{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:.06em}
.prog{display:flex;align-items:center;gap:.75rem;margin-top:.6rem}
.bar{flex:1;height:.55rem;border:1.5px solid var(--edge)}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s ease}
.prog span{font-size:.85rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.info{
  margin-top:1.1rem; padding:.75rem .9rem; display:grid; gap:.4rem;
  background-color:var(--card); background-image:var(--tex);
  border:2px solid var(--edge); border-left:.4rem solid var(--primary);
}
.grp{
  margin-top:1.15rem; background-color:var(--card); background-image:var(--tex);
  border:2px solid var(--edge); box-shadow:.22rem .22rem 0 var(--shadow-c);
}
.grp h3{
  margin:0; padding:.5rem .9rem; display:flex; justify-content:space-between; align-items:center; gap:.6rem;
  background:var(--primary); color:var(--on-primary); font-size:1rem; font-weight:800; letter-spacing:.06em;
  border-bottom:2px solid var(--edge);
}
.grp .cnt{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:.8rem;min-height:var(--tap);padding:.35rem .9rem;cursor:pointer}
.item+.item{border-top:1px dashed var(--line)}
.item input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;flex:0 0 1.4rem;width:1.4rem;height:1.4rem;margin:0;
  border:2px solid var(--edge);background:transparent;display:grid;place-items:center;
}
.item input[type="checkbox"]::after{
  content:"";width:.7rem;height:.36rem;border-left:3px solid #FAF4E6;border-bottom:3px solid #FAF4E6;
  transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s ease;
}
.item input[type="checkbox"]:checked{background:var(--red);border-color:var(--red)}
.item input[type="checkbox"]:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.item span{min-width:0;line-height:1.55;font-size:.95rem}
.item input[type="checkbox"]:checked+span{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;opacity:.6}
.resetwrap{padding:1.3rem 0 0;display:flex;justify-content:center}
.resetwrap .map{margin-top:0}

/* ── 底部導覽、提示 ── */
.dock{
  position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:30;
  width:min(100%,480px); display:grid; grid-template-columns:repeat(4,1fr);
  background-color:var(--card); background-image:var(--tex);
  border-top:2px solid var(--edge); padding-bottom:env(safe-area-inset-bottom,0px);
}
.dock button{
  position:relative; min-height:max(52px,3.3rem); background:none; border:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.1rem;
  font-size:.74rem; font-weight:700; letter-spacing:.08em;
}
.dock button+button{border-left:1px solid var(--line)}
.dock svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"],.dock button[aria-pressed="true"]{color:var(--red-text)}
.dock button[aria-current="page"]::before,.dock button[aria-pressed="true"]::before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:.28rem;background:var(--red)}
.toast{
  position:fixed; left:50%; bottom:calc(4.6rem + env(safe-area-inset-bottom,0px)); z-index:60;
  transform:translate(-50%,.5rem); max-width:calc(100% - 2rem); text-align:center;
  background:var(--ink); color:var(--bg); padding:.55rem 1rem; font-size:.85rem; font-weight:700;
  opacity:0; pointer-events:none; transition:opacity .2s ease,transform .2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── 捲動進場 ── */
.reveal{opacity:0;transform:translateY(1.2rem);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .tab::after{transition:none}
}

/* ── 蓋印、編輯 ── */
.daybar .date .dc{margin-left:.8em;font-weight:700;color:var(--red-text)}
.acts{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.7rem}
.acts .map{margin-top:0}
.stampbtn{position:relative;flex:none;width:max(48px,3.2rem);height:max(48px,3.2rem);padding:0;background:none;border:0;display:grid;place-items:center}
.empty-st{width:100%;height:100%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--line);font-size:.78rem;font-weight:700;letter-spacing:.06em}
.stampbtn:active .empty-st{border-color:var(--red);color:var(--red-text)}
.stampbtn .sealbox{position:relative;width:3.5rem;height:3.5rem;opacity:.94;pointer-events:none}
.stop.done::after{background:var(--red)}
.empty{margin:1.4rem 1rem 0;padding:1rem;border:2px dashed var(--line);font-size:.9rem;color:var(--line);text-align:center}
.tab.add{color:var(--red-text);opacity:1}
.tab.add .l1{font-size:1.2rem}
.editnote{margin:.9rem 1rem 0;padding:.5rem .8rem;border:1.5px dashed var(--red);font-size:.8rem;line-height:1.6;color:var(--red-text)}
.dayform{margin:.8rem 1rem 0;padding:.8rem .9rem;display:grid;gap:.55rem;background-color:var(--card);background-image:var(--tex);border:2px solid var(--edge);border-top:.4rem solid var(--primary)}
.ef{display:grid;gap:.5rem}
.fld{display:grid;grid-template-columns:3.9rem minmax(0,1fr);gap:.5rem;align-items:start;font-size:.82rem}
.fld>span{padding-top:.75rem;font-weight:700;color:var(--line)}
.fld input,.fld textarea,.fld select,.item .it,.grp .gt{
  width:100%;min-width:0;min-height:var(--tap);margin:0;padding:.4rem .6rem;border:1.5px solid var(--edge);border-radius:0;
  background:var(--bg);color:var(--ink);font:inherit;font-size:max(16px,1rem);line-height:1.5;
}
.fld input,.fld textarea,.item .it,.grp .gt{-webkit-appearance:none;appearance:none}
.fld textarea{resize:vertical;min-height:4.4rem}
.eb,.gadd{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.gadd{padding:.6rem .9rem .8rem;margin-top:0;border-top:1px dashed var(--line)}
.pg.sm{flex:1 1 auto;padding:0 .75rem;font-size:.82rem}
.pg:disabled{opacity:.35}
.pg.dl,.x{color:var(--red-text);border-color:var(--red)}
.addrow{padding:1rem 1rem 0;display:flex;gap:.7rem}
.addrow .pg{flex:1;background-color:var(--card)}
.x{min-width:var(--tap);min-height:var(--tap);padding:0 .6rem;border:2px solid var(--red);background:transparent;font-size:.85rem;font-weight:700}
.armed,.pg.armed,.x.armed{background:var(--red)!important;color:#FAF4E6!important;border-color:var(--red)!important}
.item.editing{gap:.5rem;cursor:default}
.item.editing .it{flex:1}
.grp h3 .gt{flex:1;font-weight:800;letter-spacing:.04em}
.listwrap .addrow{padding-left:0;padding-right:0}

/* ── 路線圖 ── */
.rcard{margin:1rem 1rem 0;background-color:var(--card);background-image:var(--tex);border:2px solid var(--edge);box-shadow:.22rem .22rem 0 var(--shadow-c)}
.rcard summary{display:flex;align-items:center;justify-content:space-between;min-height:var(--tap);padding:0 .9rem;font-weight:800;letter-spacing:.08em;cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
.rcard summary::-webkit-details-marker{display:none}
.rcard summary::after{content:"";width:.5rem;height:.5rem;border-right:2px solid var(--edge);border-bottom:2px solid var(--edge);transform:rotate(45deg);margin-top:-.2rem;transition:transform .2s ease}
.rcard[open] summary::after{transform:rotate(-135deg);margin-top:.2rem}
.rbody{padding:0 .6rem .8rem}
.rmap{display:block;width:100%;height:auto;border:1.5px solid var(--edge)}
.rmap text{font-family:var(--serif)}
.rm-bg{fill:var(--bg)}
#scm circle{fill:var(--bg);stroke:var(--asagi);stroke-opacity:.38;stroke-width:.8}
.rm-under{fill:none;stroke:var(--bg);stroke-width:6;stroke-linecap:round}
.rm-path{fill:none;stroke:var(--edge);stroke-width:2;stroke-linecap:round}
.rm-arr{fill:var(--edge)}
.rm-hit{fill:transparent}
.rm-mk{cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.rm-mk:focus-visible .rm-r{stroke:var(--asagi);stroke-width:3}
.rm-r{fill:var(--card);stroke:var(--red);stroke-width:2}
.rm-nm{font-size:11px;font-weight:800;fill:var(--red-text);text-anchor:middle}
.rm-plus{font-size:9px;font-weight:800;fill:var(--red-text);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.rm-mk.done .rm-r{fill:var(--red)}
.rm-mk.done .rm-nm{fill:#FAF4E6}
.rm-mk.off .rm-r{stroke-dasharray:3 2}
.rm-lb{font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;cursor:pointer}
.rm-sc{fill:none;stroke:var(--ink);stroke-width:1.3}
.rm-st{font-size:9px;fill:var(--ink)}
.rcap{margin:.55rem .2rem 0;font-size:.78rem;line-height:1.6;color:var(--line)}
.lgd{display:flex;flex-wrap:wrap;gap:.2rem .8rem;margin:.5rem .2rem 0;padding:0;list-style:none;font-size:.76rem;line-height:1.5;color:var(--ink)}
.lgd[hidden]{display:none}
.lgd li{white-space:nowrap;cursor:pointer;padding:0 .2rem;border-radius:3px}
.lgd li.on{background:var(--card);font-weight:800;outline:1.5px solid var(--edge)}
.lgd i{display:inline-block;width:1.1rem;height:.32rem;margin-right:.3rem;border-radius:2px;vertical-align:middle}
.rbody .map{margin-top:.6rem}
.stop.flash .card{animation:flashcard 1.3s ease}
@keyframes flashcard{0%,60%{box-shadow:0 0 0 4px var(--red)}100%{box-shadow:.22rem .22rem 0 var(--shadow-c)}}

/* ── 路線圖：播放 ── */
.rm-lk{font-size:9.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.rm-tint{fill:var(--primary);opacity:0;pointer-events:none}
.rm-path{stroke-width:2.2;stroke-dasharray:.1 5.5}
.rm-prog{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:butt}
.rm-ring{fill:none;stroke:var(--red);stroke-width:1.6;stroke-dasharray:3 3;opacity:0;transform-box:fill-box;transform-origin:center}
.rm-mk.cur .rm-ring{opacity:1;animation:ringspin 6s linear infinite}
@keyframes ringspin{to{transform:rotate(360deg)}}
.rmap.pbmode .rm-mk{opacity:.5;transition:opacity .25s}
.rmap.pbmode .rm-mk.seen,.rmap.pbmode .rm-mk.cur{opacity:1}
.rm-tok{pointer-events:none}
.rm-sh{fill:#000;opacity:.18}
.rm-face{fill:#FAF4E6;stroke:#1F1B18;stroke-width:1.6}
.rm-hat{fill:var(--mustard);stroke:#1F1B18;stroke-width:1.6;stroke-linejoin:round}
.rm-band{fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round}
.rm-tok.moving .rm-tb{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.pb{margin-top:.7rem;padding:.7rem .8rem .75rem;border:2px solid var(--edge);background:var(--bg)}
.pb-top{display:flex;align-items:baseline;gap:.8rem}
.pb-clock{flex:none;font-size:1.8rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.pb-act{flex:1;min-width:0;font-size:.92rem;font-weight:700;line-height:1.5}
.pb-ctl{display:flex;align-items:center;gap:.7rem;margin-top:.35rem}
.pb-play{flex:none;width:max(48px,3.1rem);height:max(48px,3.1rem);padding:0;border-radius:50%;border:2px solid var(--edge);background:var(--red);color:#FAF4E6;display:grid;place-items:center}
.pb-play svg{width:1.3rem;height:1.3rem;fill:currentColor}
.pb-range{--pct:0%;flex:1;min-width:0;height:var(--tap);margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none}
.pb-range::-webkit-slider-runnable-track{height:.55rem;border:1.5px solid var(--edge);background:linear-gradient(to right,var(--red) var(--pct),transparent var(--pct))}
.pb-range::-moz-range-track{height:.55rem;border:1.5px solid var(--edge);background:linear-gradient(to right,var(--red) var(--pct),transparent var(--pct))}
.pb-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--card);border:2px solid var(--edge);margin-top:calc((.55rem + 3px - 1.5rem) / 2 - 2px)}
.pb-range::-moz-range-thumb{width:1.2rem;height:1.2rem;border-radius:50%;background:var(--card);border:2px solid var(--edge)}
.pb-speed{flex:none;min-width:3.4rem;min-height:var(--tap);padding:0 .7rem;border:2px solid var(--edge);border-radius:999px;background:var(--card);font-weight:800;font-size:.9rem}
.pb-speed:active{background:var(--primary);color:var(--on-primary)}
@media (prefers-reduced-motion: reduce){.rm-mk.cur .rm-ring,.rm-tok.moving .rm-tb{animation:none}}

/* ── 路線圖 v3：頭像、園區、切換 ── */
.seg{display:flex;gap:0;margin:0 0 .6rem;border:2px solid var(--edge)}
.seg button{flex:1;min-height:var(--tap);padding:0 .6rem;border:0;background:transparent;font-weight:800;font-size:.88rem;letter-spacing:.04em}
.seg button+button{border-left:2px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.pz{stroke:var(--edge);stroke-width:1;stroke-opacity:.4;fill-opacity:.24}
.pz-primary{fill:var(--primary)}.pz-green{fill:var(--green)}.pz-asagi{fill:var(--asagi)}
.pz-red{fill:var(--red)}.pz-sakura{fill:var(--sakura)}.pz-mustard{fill:var(--mustard)}.pz-line{fill:var(--line)}
.pz-water{fill:var(--asagi);fill-opacity:.4;stroke:var(--asagi);stroke-width:1.2}
.pz-t{font-size:9.5px;font-weight:700;fill:var(--ink);fill-opacity:.8}
.rm-sky .rm-sun{fill:var(--mustard);stroke:var(--edge);stroke-width:1.2}
.rm-sky .rm-cr{fill:#B9AE96;opacity:0}
.rmap.dp-dusk .rm-sun{fill:var(--red)}
.rmap.dp-night .rm-sun{fill:#EFE6D2}
.rmap.dp-night .rm-cr{opacity:.8}
.rm-mk .rm-r{fill:var(--cc,var(--card));stroke:var(--edge);stroke-width:1.6}
.rm-mk .rm-nm{fill:var(--on,#1F1B18)}
.rm-mk.done .rm-r{fill:var(--red);stroke:var(--red)}
.rm-mk.done .rm-nm{fill:#FAF4E6}
.rm-mk.arrive .rm-r{transform-box:fill-box;transform-origin:center;animation:arrive .6s ease}
@keyframes arrive{0%{transform:scale(1)}35%{transform:scale(1.6)}100%{transform:scale(1)}}
.rm-av{transform-box:fill-box}
.rm-tok.moving .rm-av{animation:bob .4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.rm-tok .rm-tb{animation:none}
.party{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin-top:.7rem}
.party-l{font-size:.78rem;font-weight:700;color:var(--line);margin-right:.2rem}
.chip2{display:inline-flex;align-items:center;gap:.35rem;min-height:2.2rem;padding:0 .7rem 0 .3rem;border:2px solid var(--edge);border-radius:999px;background:var(--card);font-size:.85rem;font-weight:700}
.chipav{width:1.7rem;height:1.7rem;flex:none}
@media (prefers-reduced-motion: reduce){.rm-tok.moving .rm-av,.rm-mk.arrive .rm-r{animation:none}}

/* ── 路線圖 v4：真實地圖（Leaflet） ── */
.rmap.lmap{height:clamp(260px,78vw,360px);border:1.5px solid var(--edge);background:#E9E5DC;isolation:isolate;font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.lmap .leaflet-control-attribution{font-size:9px}
.lmap .leaflet-tile-pane{transition:filter .6s ease}
.lmap.pbmode.dp-dusk .leaflet-tile-pane{filter:sepia(.3) saturate(1.1) brightness(.95)}
.lmap.pbmode.dp-night .leaflet-tile-pane{filter:brightness(.6) saturate(.8)}
.gm-pin{background:none;border:0;outline:none}
.gm-pin .gm-svg{z-index:0}
.gm-n,.gm-plus,.gm-lb{z-index:1;white-space:nowrap}
.gm-svg{position:absolute;left:0;top:0;width:28px;height:40px;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35));transform-origin:50% 100%;transition:transform .2s ease}
.gm-p{fill:#EA4335;stroke:#B31412;stroke-width:1.2}
.gm-n{position:absolute;left:0;top:5px;width:28px;text-align:center;font:700 12px/16px system-ui,-apple-system,sans-serif;color:#fff;pointer-events:none}
.gm-plus{position:absolute;left:20px;top:-7px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:#fff;border:1px solid #B31412;color:#B31412;font:700 10px/14px system-ui,sans-serif;text-align:center;pointer-events:none}
.gm-lb{position:absolute;left:29px;top:3px;white-space:nowrap;font-size:12px;font-weight:700;line-height:1.3;color:#B31412;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #fff;pointer-events:none}
.gm-pin.done .gm-p{fill:#1E8E3E;stroke:#0D652D}
.gm-pin.done .gm-lb{color:#0D652D}
.gm-pin.done .gm-plus{border-color:#0D652D;color:#0D652D}
.gm-pin.cur .gm-svg{transform:scale(1.25)}
.gm-pin.arrive .gm-svg{animation:gmdrop .6s ease}
@keyframes gmdrop{0%{transform:translateY(-12px)}55%{transform:translateY(0)}75%{transform:translateY(-4px)}100%{transform:none}}
.gm-pin:focus-visible .gm-p{stroke:#1A73E8;stroke-width:3}
.gm-tok{background:none;border:0}
.gm-toksvg{position:absolute;left:-40px;top:-36px;width:80px;height:40px;overflow:visible}
.gm-leg{background:#fff;border:0;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;color:#3C4043;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.gm-leg::before{display:none}
.rcap.offnote{margin-top:.5rem;padding:.35rem .6rem;border:1.5px dashed var(--red);color:var(--red-text);font-weight:700}
.gm-ctl a{font-size:15px;font-weight:700;color:#3C4043;text-decoration:none}
@media (prefers-reduced-motion: reduce){.gm-pin.arrive .gm-svg{animation:none}}
</style>
</head>

  /* 建立一張地圖（kind：geo 依座標；park 依園區座標） */

    var pts = [];

    if (pts.length < 2) return null;
    var W = MW, H = pimg ? Math.round(MW * pimg.h / pimg.w) : MH, M = 34, offMode = false, sc = 1;

    if (park) {

    } else {
      var c = [med(pts.map(function (p) { return p.s.ll[0]; })), med(pts.map(function (p) { return p.s.ll[1]; }))];
      pts.forEach(function (p) { p.v = kmVec(c, p.s.ll); p.dist = Math.hypot(p.v[0], p.v[1]); });
      var maxd = Math.max.apply(null, pts.map(function (p) { return p.dist; }));
      offMode = maxd > 15 && pts.filter(function (p) { return p.dist <= 3; }).length >= 2;

        '<rect class="rm-r" x="' + (g.x - 9).toFixed(1) + '" y="' + (g.y - 9).toFixed(1) + '" width="18" height="18" rx="3"/>' +

        (g.nums.length > 1 ? '<text class="rm-plus" x="' + (g.x + 10).toFixed(1) + '" y="' + (g.y - 8).toFixed(1) + '">+' + (g.nums.length - 1) + '</text>' : '') +

  /* ── 可縮放地圖（Leaflet）：城市路線用 Esri 街道圖、園區用 PARK_IMG 底圖；沒載到 Leaflet 時改用上面的示意圖 ── */

      ? buildPaths(d.park.paths, function (x, y) { return [-y / 100 * pimg.h, x / 100 * pimg.w]; }) : null;
    if (G) legs.forEach(function (lg) { lg.path = routeOnPaths(G, [lg.ax, lg.ay], [lg.bx, lg.by]); });

  }

  var PIN = '<svg class="gm-svg" viewBox="0 0 28 40" aria-hidden="true"><path class="gm-p" d="M14 1C6.8 1 1 6.6 1 13.6 1 23 14 39 14 39S27 23 27 13.6C27 6.6 21.2 1 14 1Z"/></svg>';

  function initLiveMap(m) {
    var el = $('#dayPanel .lmap[data-kind="' + m.kind + '"]'); if (!el) return;
    var park = m.kind === 'park', map = null, lm = null;
    try {
      map = L.map(el, park
        ? { crs: L.CRS.Simple, minZoom: -3, maxZoom: 1.5, zoomSnap: 0.25, dragging: !L.Browser.mobile, scrollWheelZoom: false, attributionControl: false }

      var base = m.groups.filter(function (g) { return !g.off; });
      var near = base.length ? L.latLngBounds(base.map(function (g) { return [g.x, g.y]; })) : all;

      m.legs.forEach(function (lg) {
        var ab = lg.path || [[lg.ax, lg.ay], [lg.bx, lg.by]];

            L.polyline(ab, { color: lg.color, weight: 4.5, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map)

        if (lg.km >= 8) {
          L.tooltip({ permanent: true, direction: 'center', className: 'gm-leg', interactive: false })
            .setLatLng([lg.cx, lg.cy]).setContent(esc(fmtKm(lg.km) + '・' + lg.mode)).addTo(map);
        }
      });

      var marks = [];
      m.groups.forEach(function (g) {
        var s0 = g.stops[0], cat = CAT[s0.cat] ? s0.cat : 'sight', name = shortName(s0);

        mk.on('click', function () { gotoStop(s0.id); });
        var e = mk.getElement();
        e.setAttribute('data-sid', s0.id);
        e.setAttribute('data-sids', g.stops.map(function (s) { return s.id; }).join(','));
        e.setAttribute('role', 'button');

      var tok = L.marker([m.groups[0].x, m.groups[0].y], {
        icon: L.divIcon({ className: 'gm-tok', iconSize: [0, 0], html: '<svg class="gm-toksvg" viewBox="-40 -36 80 40" aria-hidden="true">' + tokenSVG(0, 0) + '</svg>' }),
        interactive: false, keyboard: false, zIndexOffset: 1000

      /* 右上角（城市路線）：全覽／回到主要區域、我的位置 */

          options: { position: 'topright' },
          onAdd: function () {
            var box = L.DomUtil.create('div', 'leaflet-bar gm-ctl');
            box.innerHTML = (m.offMode ? '<a href="#" role="button" data-gm="all" title="顯示全部地點" aria-label="顯示全部地點">全</a>' : '') +
              '<a href="#" role="button" data-gm="me" title="我的位置" aria-label="我的位置">◎</a>';

            L.circleMarker(e.latlng, { radius: 7, color: '#fff', weight: 2, fillColor: '#4285F4', fillOpacity: 1, interactive: false }).addTo(map)

      /* 標籤重疊時，後面的站先隱藏（放大後會出現） */

  }

  /* 城市的步行路段：向 OSM 步行導航（routing.openstreetmap.de）查沿街道的路線，查到的存在 localStorage；
     查不到（沒網路、服務掛了）就維持直線。電車、公車路段不查。 */
  var RCACHE = 'route-foot-v1';
  function walkRoutes(m, lm) {
    var cache = {};
    try { cache = JSON.parse(localStorage.getItem(RCACHE) || '{}') || {}; } catch (e) { cache = {}; }
    var todo = m.legs.filter(function (lg) { return lg.mode === '步行' && lg.km > 0.05 && lg.km < 4; });
    function key(lg) { return [lg.ay, lg.ax, lg.by, lg.bx].map(function (v) { return v.toFixed(5); }).join(','); }
    function apply(lg, coords) {
      lg.path = [[lg.ax, lg.ay]].concat(coords.map(function (c) { return [c[1], c[0]]; }), [[lg.bx, lg.by]]);
      lg.lines.forEach(function (l) { l.setLatLngs(lg.path); });
      if (route && route.models.geo === m) pbUpdate();
    }
    function next() {
      if (lmaps.geo !== lm) return; /* 已換到別天 */
      var lg = todo.shift(); if (!lg) return;
      var k = key(lg);
      if (cache[k]) { apply(lg, cache[k]); next(); return; }
      if (!window.fetch) return;
      fetch('https://routing.openstreetmap.de/routed-foot/route/v1/foot/' + lg.ay + ',' + lg.ax + ';' + lg.by + ',' + lg.bx + '?overview=full&geometries=geojson')
        .then(function (r) { return r.json(); })
        .then(function (j) {

    }

  }

  /* 地圖從隱藏變成顯示時（展開、切換分頁）要重新量尺寸 */
  function refreshLiveMaps() {

      var lm = lmaps[k];

      if (!lm.fitted) lm.fit();
      lm.declutter();
    });
  }

  function destroyLiveMaps() {
    Object.keys(lmaps).forEach(function (k) { lmaps[k].map.remove(); });
    lmaps = {};
  }

  function partyHTML() {
    var party = Array.isArray(TRIP.party) ? TRIP.party.filter(function (p) { return p && p.name; }) : [];
    if (!party.length) return '';
    return '<div class="party"><span class="party-l">今日同行夥伴</span>' + party.map(function (p) {
      return '<span class="chip2">' + (p.img ? '<svg class="chipav" viewBox="0 0 64 64" aria-hidden="true"><use href="#av-' + esc(p.img) + '" width="64" height="64"/></svg>' : '') + esc(p.name) + '</span>';
    }).join('') + '</div>';
  }

  function routeCardHTML(d) {
    route = null; curLive = [];
    var rt = resolveTimes(d.stops);
    var lf = hasLeaflet();
    var geo = lf ? buildLiveModel(d, 'geo', rt) : buildModel(d, 'geo', rt);
    var park = (lf && buildLiveModel(d, 'park', rt)) || buildModel(d, 'park', rt);
    var live = !!(geo && geo.live);
    var models = {}, order = [];
    if (geo) { models.geo = geo; order.push('geo'); }
    if (park) { models.park = park; order.push('park'); }
    if (!order.length) return '';
    curLive = order.map(function (k) { return models[k]; }).filter(function (m) { return m.live; });
    var t0 = Infinity, t1 = -Infinity;
    order.forEach(function (k) {
      if (models[k].t0 != null) t0 = Math.min(t0, models[k].t0);

      ? '<div class="seg" role="group" aria-label="切換地圖">' +
        '<button type="button" data-kind="geo" aria-pressed="true">城市路線</button>' +
        '<button type="button" data-kind="park" aria-pressed="false">' + esc(d.park.title || '園區') + '</button></div>'
      : '';
    var panel = ok
      ? '<div class="pb"><div class="pb-top"><span class="pb-clock" id="pbClock">' + fmtTime(t0) + '</span><span class="pb-act" id="pbAct"></span></div>' +
        '<div class="pb-ctl"><button type="button" class="pb-play" id="pbPlay" aria-label="播放路線動畫">' + ICON_PLAY + '</button>' +
        '<input type="range" class="pb-range" id="pbRange" min="' + Math.floor(t0) + '" max="' + Math.ceil(t1) + '" step="1" value="' + Math.floor(t0) + '" aria-label="時間軸">' +
        '<button type="button" class="pb-speed" id="pbSpeed" aria-label="播放速度">×' + SPEEDS[pb.speed] + '</button></div></div>' + partyHTML()

      order.map(function (k) { return models[k].svg; }).join('') + order.map(function (k) { return legendHTML(models[k]); }).join('') + mapStatusNote(live || hasLeaflet()) + panel +
      (d.mapNote ? '<p class="rcap geocap">' + esc(d.mapNote) + '</p>' : '') +
      (park ? '<p class="rcap pkcap" hidden>' + esc(d.park.note || '園區位置是示意，不是官方地圖。') + '</p>' : '') +
      '<p class="rcap">' + (live ? '步行路段沿實際街道與園內步道；電車等其他交通只畫直線示意。' + (L.Browser.mobile ? '用兩指拖曳、縮放地圖。' : '點地圖後可用滾輪縮放。') : '示意圖，位置與距離為概略。') +
        (ok ? '按播放看今天怎麼走，也可以拖曳時間軸。' : '') + '點圖釘可跳到該行程' +

      (url ? '<a class="map" href="' + url + '" target="_blank" rel="noopener noreferrer">' + ICON.pin + '在 Google 地圖看今日順序</a>' +

  /* 時間 T（分鐘）時，旅人在哪裡、在做什麼 */
  function routeState(m, T) {
    var j = 0, moving = null;
    m.pts.forEach(function (p, n) { if (p.tmin <= T) j = n; });
    m.legs.forEach(function (lg) { if (T > lg.t0 && T < lg.t1) moving = lg; });
    var x, y, f = 0;
    if (moving) {
      f = (T - moving.t0) / Math.max(moving.t1 - moving.t0, 1e-6);
      var q = legPt(moving, ease(f)); x = q[0]; y = q[1];
    } else { x = m.pts[j].g.x; y = m.pts[j].g.y; }
    return { x: x, y: y, moving: moving, j: j, f: f };
  }

  function pbUpdate() {
    var r = route; if (!r || !r.ui) return;
    var m = r.models[r.active]; if (!m || !m.el) return;
    var el = m.el, ui = r.ui, T = pb.T, st = routeState(m, T);
    if (m.live && !el.tok) return;
    if (m.live) {
      el.tok.setLatLng([st.x, st.y]);
      if (el.tokG) el.tokG.classList.toggle('moving', !!st.moving);
    } else {
      el.tok.setAttribute('transform', 'translate(' + st.x.toFixed(1) + ' ' + st.y.toFixed(1) + ')');
      el.tok.classList.toggle('moving', !!st.moving);
    }
    ui.clock.textContent = fmtTime(T);
    var cur = m.pts[st.j];
    ui.act.textContent = st.moving
      ? '前往 ' + shortName(st.moving.to) + '（' + st.moving.mode + '）'
      : (pb.stampNav && !cur.s.done ? '下一站' : (VERB[cur.s.cat] || '')) + '｜' + shortName(cur.s);
    m.legs.forEach(function (lg, k) {
      var f = lg.t1 > lg.t0 ? Math.max(0, Math.min(1, (T - lg.t0) / (lg.t1 - lg.t0))) : (T >= lg.t1 ? 1 : 0);
      var p = el.prog[k]; if (!p) return;

      }
      p.style.visibility = f > 0 ? 'visible' : 'hidden';
      p.style.strokeDasharray = ease(f).toFixed(3) + ' 1.02';

    el.svg.setAttribute('class', el.svg.getAttribute('class').replace(/dp-\w+/, dp));

    ui.range.value = String(Math.round(T));
    ui.range.style.setProperty('--pct', Math.max(0, Math.min(100, pct)).toFixed(1) + '%');
  }

  function pbMode() {
    if (route) route.order.forEach(function (k) { var e = route.models[k].el; if (e && e.svg) e.svg.classList.add('pbmode'); });
  }
  function clampT(t) { return Math.max(route.t0, Math.min(route.t1, t)); }

  /* ── 蓋印後自動走到下一站（不用按播放） ── */
  function stampMove(k, done) {
    if (!route || !route.ui || !route.rt) return;
    var t = route.rt.t;
    pbSetPlaying(false);
    pb.stampNav = true;
    pbMode();
    if (!done || k + 1 >= t.length) { pb.T = clampT(t[k]); pbUpdate(); followToken(); return; }
    var to = clampT(t[k + 1]), from = clampT(t[k]);
    /* 從「出發」那一刻開始走，不在原地空等停留時間 */
    var m = route.models[route.active], dep = to;
    m.legs.forEach(function (lg) { if (lg.t1 > from && lg.t1 <= to) dep = Math.min(dep, lg.t0); });
    from = Math.max(from, dep);
    if (reduce || to <= from) { pb.T = to; pbUpdate(); followToken(); return; }
    var dur = 1800, start = 0;
    pb.stampRun = true;
    pb.raf = requestAnimationFrame(function step(ts) {
      if (!route || !pb.stampRun) return;
      if (!start) start = ts;
      var f = Math.min(1, (ts - start) / dur);
      pb.T = from + (to - from) * f;
      pbUpdate();
      if (f < 1) pb.raf = requestAnimationFrame(step);
      else { pb.stampRun = false; followToken(); }
    });
  }

  /* 旅人走出畫面時，地圖跟過去 */
  function followToken() {
    var lm = route && lmaps[route.active];
    if (!lm || !lm.el.offsetWidth) return;
    var ll = lm.tok.getLatLng();
    if (!lm.map.getBounds().pad(-0.1).contains(ll)) lm.map.panTo(ll);
  }

  function pbSetPlaying(on) {
    pb.playing = on; pb.last = 0; pb.stampRun = false;
    if (on) pb.stampNav = false;
    cancelAnimationFrame(pb.raf);
    var ui = route && route.ui;
    if (ui) {
      ui.play.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
      ui.play.setAttribute('aria-label', on ? '暫停' : '播放路線動畫');
      if (on) route.order.forEach(function (k) { route.models[k].el.svg.classList.add('pbmode'); });
    }
    if (on) pb.raf = requestAnimationFrame(pbFrame);
  }

  function pbFrame(ts) {
    if (!pb.playing || !route) return;
    var dt = pb.last ? Math.min((ts - pb.last) / 1000, 0.1) : 0;
    pb.last = ts;
    pb.T += dt * BASE * SPEEDS[pb.speed];
    if (pb.T >= route.t1) { pb.T = route.t1; pbUpdate(); pbSetPlaying(false); return; }
    pbUpdate();
    pb.raf = requestAnimationFrame(pbFrame);
  }

  function stopPlayback() {
    cancelAnimationFrame(pb.raf);
    pb.playing = false; pb.last = 0;
    route = null;
    destroyLiveMaps();
  }

  function initPlayback() {
    curLive.forEach(initLiveMap);
    if (!route) return;
    var root = $('#dayPanel .rcard'); if (!root) return;

      range: $('#pbRange', root), speed: $('#pbSpeed', root)
    };
    if (!ui.play || !ui.range) return;
    route.order.forEach(function (k) {
      var svg = $('.rmap[data-kind="' + k + '"]', root), lm = lmaps[k];
      route.models[k].el = route.models[k].live
        ? { svg: svg, tok: lm && lm.tok, tokG: lm && lm.tokG, tint: null, marks: lm ? lm.marks : [], prog: lm ? lm.progs : [] }
        : { svg: svg, tok: $('.rm-tok', svg), tint: $('.rm-tint', svg), marks: $$('.rm-mk', svg), prog: $$('.rm-prog', svg) };
    });
    route.ui = ui;
    pb.T = route.t0; pb.stampNav = false;
    /* 有蓋過印：旅人直接站在「最後蓋印的下一站」 */
    var dd = data.days[state.day], last = -1;
    if (dd) dd.stops.forEach(function (s, i) { if (s.done) last = i; });
    if (last >= 0 && route.rt) {
      pb.T = clampT(route.rt.t[Math.min(last + 1, route.rt.t.length - 1)]);
      pb.stampNav = true;
      pbMode();
    }
    ui.play.addEventListener('click', function () {
      if (pb.playing) { pbSetPlaying(false); return; }
      if (pb.T >= route.t1) pb.T = route.t0;
      pbSetPlaying(true);
    });
    ui.speed.addEventListener('click', function () {
      pb.speed = (pb.speed + 1) % SPEEDS.length;
      ui.speed.textContent = '×' + SPEEDS[pb.speed];
    });
    ui.range.addEventListener('input', function () {
      pbSetPlaying(false);

    $$('.seg button', root).forEach(function (b) {

        $$('.seg button', root).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });

        });
        var gc = $('.geocap', root); if (gc) gc.hidden = (k !== 'geo');

        if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        raiseLeg(route.models[li.parentNode.getAttribute('data-kind')], Number(li.getAttribute('data-k')));
      }
      li.addEventListener('click', pick);
      li.addEventListener('keydown', pick);
    });
    pbUpdate();

  function updateProgress() {
    var total = 0, done = 0;
    $$('#view-list .grp').forEach(function (g) {
      var all = $$('input[type="checkbox"]', g), on = all.filter(function (i) { return i.checked; }).length;
      total += all.length; done += on;
      var c = $('.cnt', g); if (c) c.textContent = on + ' / ' + all.length;
    });
    var fill = $('#barFill'), txt = $('#progTxt');
    if (fill) fill.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    if (txt) txt.textContent = '已完成 ' + done + ' / ' + total;
  }

  function findGroup(id) {
    for (var i = 0; i < data.checklist.length; i++) if (data.checklist[i].id === id) return data.checklist[i];
    return null;
  }
  function findItem(id) {
    for (var i = 0; i < data.checklist.length; i++) {
      var its = data.checklist[i].items;
      for (var j = 0; j < its.length; j++) if (its[j].id === id) return { g: data.checklist[i], i: j, it: its[j] };
    }
    return null;
  }
  function stopIndex(d, id) {
    for (var i = 0; i < d.stops.length; i++) if (d.stops[i].id === id) return i;
    return -1;
  }

  /* ── 捲動進場 ── */
  var io = null;
  function observeReveals(root) {
    var els = $$('.reveal', root);
    if (reduce || !('IntersectionObserver' in window)) {
      els.forEach(function (e) { e.classList.add('in'); });
      return;
    }
    if (!io) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });
    }
    els.forEach(function (e) { io.observe(e); });
  }

  /* ── 狀態與路由（#day1…、#list） ── */
  function clampDay(i) { return Math.max(0, Math.min(data.days.length - 1, i)); }

  function readHash() {
    var h = (location.hash || '').replace(/^#/, ''), m;
    if (h === 'list') { state.view = 'list'; return true; }
    m = /^day(\d+)$/.exec(h);
    if (m) { state.view = 'days'; state.day = clampDay(parseInt(m[1], 10) - 1); return true; }
    return false;
  }

  function pickToday() {
    try {
      if (!TRIP.start) return;
      var p = TRIP.start.split('-').map(Number);
      var s = new Date(p[0], p[1] - 1, p[2]);
      var n = new Date();
      var t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      var diff = Math.round((t0 - s) / 86400000);
      if (diff >= 0 && diff < data.days.length) state.day = diff;
    } catch (e) { /* 忽略 */ }
  }

  function setHash() {
    var t = state.view === 'list' ? 'list' : 'day' + (state.day + 1);
    try { if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t); } catch (e) { /* 忽略 */ }
  }

  function paint() {
    var isDays = state.view === 'days';
    $('#view-days').hidden = !isDays;
    $('#view-list').hidden = isDays;
    $$('.dock [data-view]').forEach(function (b) {
      if (b.dataset.view === state.view) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    $('.dock [data-act="edit"]').setAttribute('aria-pressed', String(state.edit));
    state.day = clampDay(state.day);
    if (isDays) { renderTabs(); renderDay(); centerTab(state.day); }
    else { stopPlayback(); renderList(); }
    setHash();
  }

  function selectDay(i) {
    state.day = clampDay(i);
    renderDay(); centerTab(state.day); setHash();
    var bar = $('#tabbar'), p = $('#dayPanel');
    var bt = bar.getBoundingClientRect().top, bh = bar.offsetHeight;
    var pt = p.getBoundingClientRect().top;
    if (pt < bt + bh) window.scrollTo(0, window.scrollY + pt - bt - bh);
  }

  function restoreAll() {
    clearTimeout(saveTimer);
    dirty = false;
    try { localStorage.removeItem(KEY); } catch (e) { /* 忽略 */ }
    data = baseData();
    state.day = clampDay(state.day);
    paint();
    toast('已還原為原始行程');
  }

  /* ── 分享與提示 ── */
  var toastTimer = 0;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  function copyText(t) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve(!!ok);
      } catch (e) { return Promise.resolve(false); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  function share() {
    var url = TRIP.shareUrl || location.href;
    var payload = { title: TRIP.title || '行程', text: (TRIP.title || '行程') + '｜' + (TRIP.range || ''), url: url };
    var doCopy = function () {
      copyText(url).then(function (ok) { toast(ok ? '已複製網址' : '無法複製，請從網址列手動複製'); });
    };
    if (navigator.share) {
      navigator.share(payload).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        doCopy();
      });
    } else {
      doCopy();
    }
  }

  /* ════ 事件 ════ */
  $('#tabs').addEventListener('click', function (e) {
    var add = e.target.closest('[data-add]');
    if (add) {
      data.days.push(cleanDay({ date: '', title: '新的一天', stops: [] }, data.days.length));
      relabel(); state.day = data.days.length - 1; persist(); paint();
      var f = $('#dayPanel [data-df="title"]'); if (f) f.focus();
      return;
    }
    var b = e.target.closest('.tab'); if (b) selectDay(Number(b.dataset.i));
  });

  var panel = $('#dayPanel');
  panel.addEventListener('toggle', function (e) {
    if (e.target.classList && e.target.classList.contains('rcard')) {
      mapOpen = e.target.open;
      if (!mapOpen && route) pbSetPlaying(false);
      if (mapOpen) refreshLiveMaps();
    }
  }, true);
  panel.addEventListener('keydown', function (e) {
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.classList && t.classList.contains('rm-mk')) {
      e.preventDefault(); gotoStop(t.getAttribute('data-sid'));
    }
  });
  panel.addEventListener('click', function (e) {
    if (e.target.closest('.lmap')) return; /* 真實地圖的點擊由 Leaflet 自己處理 */
    var rm = e.target.closest('.rm-mk, .rm-lb');
    if (rm) { gotoStop(rm.getAttribute('data-sid')); return; }
    var go = e.target.closest('[data-go]');
    if (go) { selectDay(state.day + Number(go.dataset.go)); return; }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, d = data.days[state.day], art = b.closest('.stop'), idx, el;
    if (!d) return;

    if (act === 'done') {
      var s = d.stops[stopIndex(d, art.dataset.sid)]; if (!s) return;
      s.done = !s.done;
      art.classList.toggle('done', s.done);
      b.classList.toggle('on', s.done);
      b.setAttribute('aria-pressed', String(s.done));
      b.innerHTML = s.done ? stampInner(s, true) : '<span class="empty-st">蓋印</span>';
      updateDayCount(); refreshMapDone(); persist();
      stampMove(stopIndex(d, s.id), s.done);
      if (s.done) { try { if (navigator.vibrate) navigator.vibrate(18); } catch (er) { /* 忽略 */ } }
      return;
    }
    if (act === 'up' || act === 'down') {
      idx = stopIndex(d, art.dataset.sid);
      var to = act === 'up' ? idx - 1 : idx + 1;
      if (idx < 0 || to < 0 || to >= d.stops.length) return;
      var tmp = d.stops[idx]; d.stops[idx] = d.stops[to]; d.stops[to] = tmp;
      renderDay(); persist();
      el = $('[data-sid="' + tmp.id + '"]', panel); if (el) el.scrollIntoView({ block: 'center' });
      return;
    }
    if (act === 'add-stop' || act === 'add-after') {
      var ns = cleanStop({ name: '新行程', cat: 'sight' });
      if (act === 'add-stop') d.stops.push(ns);
      else d.stops.splice(stopIndex(d, art.dataset.sid) + 1, 0, ns);
      renderDay(); persist();
      el = $('[data-sid="' + ns.id + '"] [data-f="name"]', panel);
      if (el) { el.focus(); el.select(); }
      return;
    }
    if (act === 'del') {
      arm(b, '確認刪除', function () {
        idx = stopIndex(d, art.dataset.sid);
        if (idx >= 0) d.stops.splice(idx, 1);
        renderDay(); persist();
      });
      return;
    }
    if (act === 'del-day') {
      arm(b, '確認刪除這一天', function () {
        data.days.splice(state.day, 1); relabel();
        state.day = clampDay(state.day); persist(); paint();
      });
      return;
    }
    if (act === 'restore') arm(b, '再按一次：清除所有編輯與印章', restoreAll);
  });

  panel.addEventListener('input', function (e) {
    var el = e.target, d = data.days[state.day];
    if (!d) return;
    if (el.dataset.df) {
      var k = el.dataset.df;
      if (k === 'notes') d.notes = el.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      else d[k] = el.value;
      if (k === 'date') { var l2 = $('#tab-' + state.day + ' .l2'); if (l2) l2.textContent = el.value; }
      persist(); return;
    }
    var f = el.dataset.f, art = el.closest('.stop');
    if (!f || !art) return;
    var s = d.stops[stopIndex(d, art.dataset.sid)]; if (!s) return;
    if (f === 'tags') s.tags = el.value.split(/[、,，]/).map(function (x) { return x.trim(); }).filter(Boolean);
    else if (f === 'll') s.ll = parseLL(el.value);
    else if (f === 'pk') s.pk = parsePK(el.value);
    else if (f === 'cat') {
      s.cat = CAT[el.value] ? el.value : 'sight';
      art.className = art.className.replace(/cat-\w+/, 'cat-' + s.cat);
    } else s[f] = el.value;
    if (f === 't') $('.time', art).textContent = el.value;
    persist();
  });

  var list = $('#view-list');
  list.addEventListener('change', function (e) {
    var i = e.target;
    if (!i || i.type !== 'checkbox') return;
    var f = findItem(i.dataset.iid); if (!f) return;
    f.it.done = i.checked;
    persist(); updateProgress();
  });
  list.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.if === 't') {
      var f = findItem(el.closest('.item').dataset.iid); if (f) { f.it.t = el.value; persist(); }
    } else if (el.dataset.gf === 'title') {
      var g = findGroup(el.closest('.grp').dataset.gid); if (g) { g.title = el.value; persist(); }
    }
  });
  list.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, grp = b.closest('.grp'), g = grp ? findGroup(grp.dataset.gid) : null, el;

    if (act === 'reset-checks') {
      arm(b, '再按一次，確認全部取消', function () {
        data.checklist.forEach(function (x) { x.items.forEach(function (it) { it.done = false; }); });
        persist(); renderList();
      });
    } else if (act === 'add-item' && g) {
      var it = { id: uid(), t: '', done: false };
      g.items.push(it); persist(); renderList();
      el = $('[data-iid="' + it.id + '"] .it', list); if (el) el.focus();
    } else if (act === 'del-item' && g) {
      arm(b, '確認', function () {
        var f = findItem(b.closest('.item').dataset.iid);
        if (f) f.g.items.splice(f.i, 1);
        persist(); renderList();
      });
    } else if (act === 'del-group' && g) {
      arm(b, '確認刪除分類', function () {
        data.checklist.splice(data.checklist.indexOf(g), 1);
        persist(); renderList();
      });
    } else if (act === 'add-group') {
      var ng = { id: uid(), title: '新分類', items: [] };
      data.checklist.push(ng); persist(); renderList();
      el = $('[data-gid="' + ng.id + '"] .gt', list); if (el) { el.focus(); el.select(); }
    } else if (act === 'restore') {
      arm(b, '再按一次：清除所有編輯與印章', restoreAll);
    }
  });

  $('.dock').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var a = b.dataset.act;
    if (a === 'share') { share(); return; }
    if (a === 'edit') {
      state.edit = !state.edit;
      if (state.edit) toast('編輯模式：修改自動存在這支手機');
      paint(); return;
    }
    if (b.dataset.view && b.dataset.view !== state.view) {
      state.view = b.dataset.view; paint(); window.scrollTo(0, 0);
    }
  });

  window.addEventListener('hashchange', function () { if (readHash()) paint(); });
  window.addEventListener('load', function () { if (state.view === 'days') centerTab(state.day); });

  /* ── 啟動 ── */
  renderHero();
  if (!readHash()) pickToday();
  paint();
})();

</script>
</body>
</html>
